<!doctype html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>#ЧЁпоЧЁМ — Оптовый каталог одежды</title>
  <meta name="description" content="Оптовый каталог одежды #ЧЁпоЧЁМ. Брюки, платья, рубашки и другие позиции оптом." />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { manrope: ["Manrope", "sans-serif"] },
          colors: {
            orange: { DEFAULT: "#FF6B00" },
            blue: { DEFAULT: "#3B3BFF" },
          },
          keyframes: {
            fadeIn: {
              "0%": { opacity: "0", transform: "translateY(10px)" },
              "100%": { opacity: "1", transform: "translateY(0)" },
            },
          },
          animation: { fadeIn: "fadeIn 0.4s ease forwards" },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <style>
    * {
      font-family: "Manrope", sans-serif;
    }

    ::-webkit-scrollbar {
      width: 4px;
    }

    ::-webkit-scrollbar-thumb {
      background: #d1d1d1;
      border-radius: 2px;
    }

    [data-filter-content] {
      display: none;
    }

    [data-filter-item][data-open="true"] [data-filter-content] {
      display: block;
    }

    [data-chevron] {
      transition: transform 0.25s ease;
    }

    [data-filter-item][data-open="true"] [data-chevron] {
      transform: rotate(180deg);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body class="bg-white text-black">
  <header class="sticky top-0 z-50 bg-white h-16 flex items-center justify-center">
    <div class="w-full max-w-[1300px] mx-auto px-4 flex items-center justify-between">
      <a href="index.html" class="text-[15px] font-extrabold text-black no-underline">#ЧЁпоЧЁМ</a>
      <nav class="hidden md:flex gap-8">
        <a href="index.html"
          class="text-[15px] font-regular text-black hover:opacity-80 transition-opacity no-underline">каталог</a>
        <a href="#contacts"
          class="text-[15px] font-regular text-black hover:opacity-80 transition-opacity no-underline">контакты</a>
      </nav>
      <div id="headerSearchWrap" class="relative flex items-center">
        <div id="headerSearchBox" class="flex items-center gap-2 overflow-hidden transition-all duration-300"
          style="width: 32px">
          <button id="searchBtn"
            class="w-8 h-8 flex-shrink-0 flex items-center justify-center rounded-full transition-colors">
            <img src="search.svg" alt="поиск" class="w-[18px] h-[18px]" />
          </button>
          <input id="mainSearchInput" type="text" placeholder="Поиск товаров..."
            class="flex-1 border-none outline-none text-[14px] bg-transparent placeholder-gray-400 min-w-0" />
          <button id="searchClose" class="text-gray-400 hover:text-black text-xl leading-none flex-shrink-0 hidden">
            &times;
          </button>
        </div>
        <div id="searchResults" class="hidden absolute right-0 top-full mt-2 bg-white shadow-xl z-[300] overflow-y-auto"
          style="width: min(900px, 95vw); max-height: 80vh; right: -32px"></div>
      </div>
    </div>
  </header>

  <div class="max-w-[1300px] mx-auto px-2.5 sm:px-4">
    <div class="flex flex-col lg:flex-row items-start gap-2 pt-4">
      <aside id="mainSidebar"
        class="hidden lg:block w-full lg:w-[360px] lg:min-w-[260px] lg:sticky lg:top-16 lg:h-[calc(100vh-64px)] overflow-y-auto bg-white flex-shrink-0 lg:pt-[76px]">
        <div class="pr-4 pb-4">
          <div class="flex justify-between items-center mb-4">
            <span class="text-[14px] font-semibold">фильтрация</span>
            <button id="resetFilters" class="text-[14px] text-gray-400 hover:text-black transition-colors">
              сбросить
            </button>
          </div>

          <div data-filter-item data-open="false" class="px-3 mb-3 border border-black">
            <button data-filter-trigger
              class="flex justify-between items-center w-full py-3 text-[14px] font-medium hover:opacity-60 transition-opacity">
              тип
              <svg data-chevron width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2.5">
                <path d="M6 9l6 6 6-6" />
              </svg>
            </button>
            <div data-filter-content class="pb-3">
              <select id="typeSelect"
                class="w-full text-[14px] outline-none focus:border-black bg-white appearance-none cursor-pointer">
                <option value="">Все типы</option>
                <option value="одежда">Одежда</option>
                <option value="электроника">Электроника</option>
                <option value="обувь">Обувь</option>
                <option value="аксессуары">Аксессуары</option>
                <option value="сумки">Сумки</option>
                <option value="спорт">Спорт</option>
                <option value="косметика">Косметика</option>
                <option value="текстиль">Текстиль</option>
                <option value="игрушки">Игрушки</option>
                <option value="другое">Другое</option>
              </select>
            </div>
          </div>

          <div data-filter-item data-open="false" class="px-3 mb-3 border border-black">
            <button data-filter-trigger
              class="flex justify-between items-center w-full py-3 text-[14px] font-medium hover:opacity-60 transition-opacity">
              стоимость за ед.
              <svg data-chevron width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2.5">
                <path d="M6 9l6 6 6-6" />
              </svg>
            </button>
            <div data-filter-content class="pb-3 space-y-2">
              <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox"
                  class="price-cb accent-black w-3.5 h-3.5" value="under100" /><span class="text-[12px]">до 100
                  руб.</span></label>
              <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox"
                  class="price-cb accent-black w-3.5 h-3.5" value="100to500" /><span class="text-[12px]">от 100 до 500
                  руб.</span></label>
              <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox"
                  class="price-cb accent-black w-3.5 h-3.5" value="over500" /><span class="text-[12px]">от 500
                  руб.</span></label>
            </div>
          </div>

          <div data-filter-item data-open="false" class="px-3 mb-3 border border-black">
            <button data-filter-trigger
              class="flex justify-between items-center w-full py-3 text-[14px] font-medium hover:opacity-60 transition-opacity">
              локация
              <svg data-chevron width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2.5">
                <path d="M6 9l6 6 6-6" />
              </svg>
            </button>
            <div data-filter-content class="pb-3">
              <select id="locationSelect"
                class="w-full text-[14px] outline-none focus:border-black bg-white appearance-none cursor-pointer">
                <option value="">Любая</option>
              </select>
            </div>
          </div>

          <div data-filter-item data-open="false" class="px-3 border border-black">
            <button data-filter-trigger
              class="flex justify-between items-center w-full py-3 text-[14px] font-medium hover:opacity-60 transition-opacity">
              кол-во
              <svg data-chevron width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2.5">
                <path d="M6 9l6 6 6-6" />
              </svg>
            </button>
            <div data-filter-content class="pb-3">
              <select id="quantitySelect"
                class="w-full text-[14px] outline-none focus:border-black bg-white appearance-none cursor-pointer">
                <option value="">Любое</option>
              </select>
            </div>
          </div>

          <div class="pt-4 mt-2">
            <button id="applyFilters"
              class="w-full bg-black text-white text-[13px] uppercase py-3 hover:opacity-80 transition-opacity">
              Применить
            </button>
          </div>
        </div>
      </aside>

      <main class="flex-1 min-w-0 pb-12">
        <div class="flex md:grid lg:grid lg:grid-cols-3 gap-4 items-center justify-between py-4 mb-2">
          <div class="hidden lg:block"></div>
          <div>
            <h1 class="text-3xl lg:text-4xl font-extrabold uppercase tracking-tight">
              / Каталог
            </h1>
          </div>
          <div class="flex justify-end items-center gap-3">
            <div class="relative" id="sortDropdownWrap">
              <button id="sortBtn" class="w-9 h-9 flex items-center justify-center hover:opacity-70 transition-opacity"
                title="Сортировка">
                <img src="filters.svg" alt="фильтры" class="w-4 h-4" />
              </button>
              <div id="sortMenu"
                class="hidden absolute right-0 top-full mt-2 bg-white shadow-xl z-50 min-w-[160px] py-1.5">
                <button data-sort="new"
                  class="sort-option w-full text-left px-4 py-2 text-[13px] hover:bg-gray-50 transition-colors">
                  новые сначала
                </button>
                <button data-sort="old"
                  class="sort-option w-full text-left px-4 py-2 text-[13px] hover:bg-gray-50 transition-colors">
                  старые сначала
                </button>
                <button data-sort="cheap"
                  class="sort-option w-full text-left px-4 py-2 text-[13px] hover:bg-gray-50 transition-colors">
                  дешевле
                </button>
                <button data-sort="expensive"
                  class="sort-option w-full text-left px-4 py-2 text-[13px] hover:bg-gray-50 transition-colors">
                  дороже
                </button>
              </div>
            </div>
          </div>
        </div>

        <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
      </main>
    </div>
  </div>
  <footer id="contacts" class="max-w-[1300px] px-5 md:pl-0 mx-auto w-full py-5 mt-8">

      <div>
        <div class="text-[13px] mb-1 font-medium text-black">

    <div class="mt-5 text-[12px] text-gray-400">

  <div id="toast"
    class="fixed bottom-8 right-8 bg-black text-white text-sm font-medium px-5 py-3 rounded z-[999] opacity-0 translate-y-2 transition-all duration-300 max-w-xs pointer-events-none">

  <script type="module" src="js/catalog.js"></script>
</body>
