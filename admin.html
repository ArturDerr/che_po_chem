<!doctype html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Админ-панель — #ЧЁпоЧЁМ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <style>
    * {
      font-family: "Manrope", sans-serif;
    }

    ::-webkit-scrollbar {
      width: 4px;
    }

    ::-webkit-scrollbar-thumb {
      background: #d1d1d1;
      border-radius: 2px;
    }
  </style>
</head>

<body class="bg-gray-50 text-black min-h-screen">
  <header class="bg-white h-14 flex items-center px-8 justify-between sticky top-0 z-50">
    <div class="flex items-center gap-6">
      <a href="index.html" class="text-[15px] font-extrabold text-black no-underline">#ЧЁпоЧЁМ</a>
    </div>
    <button id="logoutBtn"
      class="text-[11px] font-semibold uppercase text-gray-500 hover:text-black transition-colors px-4 py-2 hover:border-black rounded-sm">
      Выйти
    </button>
  </header>

  <div id="loginSection" class="fixed inset-0 bg-white z-[100] items-center justify-center" style="display: flex">
    <div class="w-full max-w-sm p-10 bg-white">
      <form id="loginForm" class="space-y-4">
        <div>
          <input id="loginEmail" type="email" required placeholder="email"
            class="w-full border border-gray-200 px-3 py-2.5 text-sm outline-none focus:border-black transition-colors rounded-sm" />
        </div>
        <div>
          <input id="loginPassword" type="password" required placeholder="пароль"
            class="w-full border border-gray-200 px-3 py-2.5 text-sm outline-none focus:border-black transition-colors rounded-sm" />
        </div>
        <div id="loginError" class="text-red-500 text-xs" style="display: none"></div>
        <button type="submit"
          class="w-full bg-black text-white text-[12px] uppercase font-bold py-3 hover:opacity-80 transition-opacity rounded-sm">
          Войти
        </button>
      </form>
    </div>
  </div>

  <div id="adminSection" class="max-w-5xl mx-auto px-8 py-8" style="display: none">
    <div class="grid grid-cols-[1fr_1.2fr] gap-8 items-start">
      <div class="sticky top-20">
        <h2 id="formTitle" class="text-xl font-extrabold mb-6">
          Добавить товар
        </h2>

        <form id="productForm" class="space-y-4">
          <div>
            <div id="uploadArea"
              class="border-2 border-dashed border-gray-200 rounded p-6 text-center cursor-pointer hover:border-black transition-colors">
              <input id="fileInput" type="file" accept="image/*" multiple class="hidden" />
              <svg class="mx-auto mb-2 text-gray-300" width="32" height="32" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="1.5">
                <rect x="3" y="3" width="18" height="18" rx="2" />
                <circle cx="8.5" cy="8.5" r="1.5" />
                <path d="M21 15l-5-5L5 21" />
              </svg>
            </div>
            <div id="previewList" class="flex gap-2 flex-wrap mt-3"></div>
          </div>

          <div>
            <label class="block text-[11px] font-semibold text-gray-400 mb-1.5">Название
              *</label>
            <input id="fName" type="text" required placeholder="брюки"
              class="w-full px-3 py-2 text-sm outline-none focus:border-black transition-colors rounded-sm" />
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-[11px] font-semibold uppercase tracking-widest text-gray-400 mb-1.5">Категория
                *</label>
              <input id="fCategory" type="text" required placeholder="одежда"
                class="w-full px-3 py-2 text-sm outline-none focus:border-black transition-colors rounded-sm" />
            </div>
            <div>
              <label class="block text-[11px] font-semibold uppercase tracking-widest text-gray-400 mb-1.5">Тип</label>
              <input id="fType" type="text" placeholder="брюки"
                class="w-full px-3 py-2 text-sm outline-none focus:border-black transition-colors rounded-sm" />
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-[11px] font-semibold uppercase tracking-widest text-gray-400 mb-1.5">Цена *</label>
              <div class="flex gap-2">
                <input id="fPrice" type="number" required placeholder="450" min="0"
                  class="flex-1 min-w-0 px-3 py-2 text-sm outline-none focus:border-black transition-colors rounded-sm" />
                <select id="fPriceUnit" class="border border-gray-200 px-2 py-2 text-sm outline-none focus:border-black bg-white transition-colors rounded-sm">
                  <option value="шт.">₽/шт.</option>
                  <option value="лот">₽/лот</option>
                </select>
              </div>
            </div>
            <div>
              <label
                class="block text-[11px] font-semibold uppercase tracking-widest text-gray-400 mb-1.5">Статус</label>
              <select id="fStatus"
                class="w-full border border-gray-200 px-3 py-2 text-sm outline-none focus:border-black bg-white transition-colors rounded-sm">
                <option value="актуально">Актуально</option>
                <option value="продано">Продано</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label
                class="block text-[11px] font-semibold uppercase tracking-widest text-gray-400 mb-1.5">Локация</label>
              <input id="fLocation" type="text" placeholder="Москва"
                class="w-full px-3 py-2 text-sm outline-none focus:border-black transition-colors rounded-sm" />
            </div>
            <div>
              <label
                class="block text-[11px] font-semibold uppercase tracking-widest text-gray-400 mb-1.5">Состояние</label>
              <input id="fCondition" type="text" placeholder="Новое, Б/У"
                class="w-full px-3 py-2 text-sm outline-none focus:border-black transition-colors rounded-sm" />
            </div>
          </div>

          <div>
            <label class="block text-[11px] font-semibold uppercase tracking-widest text-gray-400 mb-1.5">Количество
              (шт)</label>
            <input id="fQuantity" type="number" placeholder="100" min="0"
              class="w-full px-3 py-2 text-sm outline-none focus:border-black transition-colors rounded-sm" />
          </div>

          <div>
            <label
              class="block text-[11px] font-semibold uppercase tracking-widest text-gray-400 mb-1.5">Описание</label>
            <textarea id="fDescription" rows="3" placeholder="Описание товара..."
              class="w-full border border-gray-200 px-3 py-2 text-sm outline-none focus:border-black transition-colors rounded-sm resize-y"></textarea>
          </div>

          <div>
            <label class="block text-[11px] font-semibold uppercase tracking-widest text-gray-400 mb-1.5">Характеристики</label>
            <textarea id="fChars" rows="3" placeholder="Материал: 100% хлопок&#10;Размер: 42–50&#10;Цвет: чёрный"
              class="w-full border border-gray-200 px-3 py-2 text-sm outline-none focus:border-black transition-colors rounded-sm resize-y"></textarea>
          </div>

          <div>
            <label class="block text-[11px] font-semibold uppercase tracking-widest text-gray-400 mb-1.5">Иные
              сведения</label>
            <textarea id="fExtra" rows="2" placeholder="Дополнительная информация..."
              class="w-full border border-gray-200 px-3 py-2 text-sm outline-none focus:border-black transition-colors rounded-sm resize-y"></textarea>
          </div>

          <div class="flex gap-3 pt-2">
            <button id="submitBtn" type="submit"
              class="flex-1 bg-black text-white text-[11px] font-bold uppercase tracking-[0.12em] py-3 hover:opacity-80 transition-opacity rounded-sm">
              Добавить товар
            </button>
            <button id="cancelEdit" type="button" style="display: none"
              class="px-5 border border-gray-300 text-[11px] font-semibold   hover:border-black transition-colors rounded-sm">
              Отмена
            </button>
          </div>
        </form>
      </div>

      <div>
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-xl font-extrabold">
            Товары
          </h2>
        </div>
        <div id="productList"></div>
      </div>
    </div>
  </div>

  <div id="toast"
    class="fixed bottom-8 right-8 bg-black text-white text-sm font-medium px-5 py-3 rounded z-[999] opacity-0 translate-y-2 transition-all duration-300 max-w-xs pointer-events-none">
  </div>

  <script type="module" src="js/admin.js"></script>
</body>

</html>
